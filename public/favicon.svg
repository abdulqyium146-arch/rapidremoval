<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)"/>

  <!-- Truck cargo body -->
  <rect x="3" y="9" width="19" height="13" rx="2" fill="url(#blueGrad)"/>

  <!-- Cab -->
  <rect x="22" y="13" width="8" height="9" rx="2" fill="#38BDF8"/>

  <!-- Cab window -->
  <rect x="23.5" y="14.5" width="5" height="4" rx="1" fill="#E0F2FE" opacity="0.6"/>

  <!-- Undercarriage connector -->
  <rect x="3" y="21" width="27" height="2" rx="1" fill="#1E293B"/>

  <!-- Left wheel -->
  <circle cx="8" cy="24" r="3.2" fill="#0F172A" stroke="#94A3B8" stroke-width="1.4"/>
  <circle cx="8" cy="24" r="1.2" fill="#475569"/>

  <!-- Right wheel -->
  <circle cx="25" cy="24" r="3.2" fill="#0F172A" stroke="#94A3B8" stroke-width="1.4"/>
  <circle cx="25" cy="24" r="1.2" fill="#475569"/>

  <!-- Cargo logo label -->
  <rect x="5" y="11" width="15" height="9" rx="1" fill="rgba(255,255,255,0.08)"/>
  <text
    x="12.5" y="18.5"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-weight="900"
    font-size="7.5"
    letter-spacing="0.3"
    fill="#FFFFFF">GR</text>
</svg>
